<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet"> <!-- Podłącz plik CSS -->
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100 bg-image">
    <div class="flex flex-col md:flex-row items-center justify-center w-full max-w-md p-6 bg-white rounded-lg shadow-md">
        <!-- Lewa część z formularzem -->
        <div class="w-full p-6">
            <h2 class="text-2xl font-bold mb-6 text-center">Zaloguj się do panelu Audytu SEO</h2>
            <div class="text-center mb-4">
                <span class="text-gray-500">Zaloguj się za pomocą maila</span>
            </div>
            <form method="POST" class="space-y-4">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700">Nazwa użytkownika:</label>
                    <input type="text" id="username" name="username" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">Hasło:</label>
                    <input type="password" id="password" name="password" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
                <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">Zaloguj się</button>
            </form>

            <!-- Wyświetlanie komunikatów -->
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <ul class="mt-4 space-y-2">
                        {% for message in messages %}
                            <li class="p-2 bg-red-100 border border-red-400 text-red-700 rounded-lg">{{ message }}</li>
                        {% endfor %}
                    </ul>
                {% endif %}
            {% endwith %}
        </div>
    </div>
</body>
</html>
