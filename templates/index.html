<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audyt SEO</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet"> <!-- Podłącz plik CSS -->
</head>
<body class="flex flex-col items-center justify-center min-h-screen bg-gray-100 p-6">
    <div class="max-w-md w-full bg-white p-8 rounded-lg shadow-md text-center">
        <h2 class="text-2xl font-bold mb-6">Audyt SEO</h2>
        <form method="POST" class="space-y-4">
            <div>
                <label for="url" class="block text-gray-700">Adres URL:</label>
                <input type="text" id="url" name="url" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500" required>
            </div>
            <button type="submit" class="w-full py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Wykonaj audyt</button>
        </form>
        <div class="mt-4">
            <a href="{{ url_for('logout') }}" class="text-indigo-600 hover:underline">Wyloguj się</a>
        </div>
    </div>
</body>
</html>
